# Filebeat → Logstash → Elasticsearch. Servisler ECS JSON yazar; burada ayrıştırma, sağlık
# kontrolü gürültüsünün atılması ve kişisel veriye karşı son savunma yapılır.
input {
  beats { port => 5044 }
}

filter {
  if [message] =~ /^\{/ {
    json { source => "message" target => "app" }
    if "_jsonparsefailure" not in [tags] {
      ruby {
        code => "app = event.get('app'); app.each { |k, v| event.set(k, v) unless k == 'message' && v.nil? } if app.is_a?(Hash); event.remove('app')"
      }
    }
  }

  # Sağlık uçları ve başarılı CORS ön kontrolleri gürültüdür.
  if [url][path] =~ /^\/health/ { drop {} }

  # Son savunma: hiçbir zaman loglanmaması gereken alanlar.
  mutate {
    remove_field => ["[labels][password]", "[labels][Password]", "[labels][refreshToken]", "[labels][accessToken]",
                     "[labels][Authorization]", "[labels][email]", "[labels][Email]", "[labels][message]"]
  }

  if ![service][name] { mutate { add_field => { "[service][name]" => "%{[container][name]}" } } }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "vakifatlas-logs-%{[service][name]}-%{+YYYY.MM.dd}"
    manage_template => false
  }
}
