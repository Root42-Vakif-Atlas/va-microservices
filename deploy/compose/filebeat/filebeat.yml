# Yalnızca "vakifatlas.logs=true" etiketli konteynerlerin stdout'u (Kubernetes'te DaemonSet aynı rolü üstlenir).
filebeat.inputs:
  - type: filestream
    id: vakifatlas-containers
    paths: ["/var/lib/docker/containers/*/*.log"]
    parsers:
      - container: { stream: stdout }
    processors:
      - add_docker_metadata: { host: "unix:///var/run/docker.sock" }
      - drop_event:
          when:
            not:
              equals: { container.labels.vakifatlas_logs: "true" }

output.logstash:
  hosts: ["logstash:5044"]

logging.level: warning
