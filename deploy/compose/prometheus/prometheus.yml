global:
  scrape_interval: 15s
  evaluation_interval: 30s

# Uygulama metrikleri OTLP ile itilir (--web.enable-otlp-receiver); kaynak öznitelikleri etikete çevrilir.
otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - deployment.environment.name

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs: [{ targets: ["rabbitmq:15692"] }]
